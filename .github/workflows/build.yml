name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app
        run: DMG=1 UNIVERSAL=1 bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera
          path: build/Tessera.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Tessera.dmg \
            --title "Tessera ${GITHUB_REF_NAME#v}" --generate-notes
